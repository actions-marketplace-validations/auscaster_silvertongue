name: review

# Pull requests to this repository are reviewed by the released Action, installed as anyone installs it.
# pull_request_target runs this workflow from the base branch with the repository's secrets, and GitHub does
# not hold it for approval, so only pull requests from people with write access are reviewed: the review runs
# on the owner's Claude subscription. Do not add steps that execute pull request code.
on:
  pull_request_target:
    types: [opened, ready_for_review]
  workflow_dispatch:
    inputs:
      pull-request:
        description: Pull request number
        required: true
      voice:
        description: Voice
        default: marcus-aurelius
      humour:
        description: Humour (roast, light or off); empty for the voice's own

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!github.event.pull_request.draft && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association))
    runs-on: ubuntu-latest
    steps:
      - uses: auscaster/silvertongue@v1
        with:
          voice: ${{ inputs.voice || 'marcus-aurelius' }}
          humour: ${{ inputs.humour }}
          pull-request: ${{ inputs.pull-request }}
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
