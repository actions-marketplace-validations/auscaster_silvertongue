name: "Silvertongue: Write Like Anyone Famous"
description: Pipe any text through 65+ famous voices. Review comments, release notes, failed builds, in Gordon Ramsay or Brainrot.
author: auscaster
branding:
  icon: mic
  color: purple

inputs:
  text:
    description: The text to rewrite, such as another step's output. Its Markdown, code, links, @mentions and #numbers come through exactly as they are.
    required: true
  voice:
    description: The voice, by its slug at silvertongue.dev/voices, such as gordon-ramsay, marcus-aurelius, ricky-gervais or brainrot.
    default: marcus-aurelius
  claude-code-oauth-token:
    description: A Claude Pro or Max subscription, from `claude setup-token`, so there's no API bill.
  anthropic-api-key:
    description: An Anthropic API key. A subscription token wins when both are given.
  openai-api-key:
    description: An OpenAI API key.
  gemini-api-key:
    description: A Gemini API key.
  model:
    description: The model to write with. Defaults to your plan's model on a Claude subscription, or claude-opus-5-5, gpt-6.1-sol or gemini-4-argon for an API key.
  humour:
    description: roast goes for the laugh, light is one real laugh where the text hands it one, off plays it straight. Left empty, a comedian roasts and everyone else gives comic relief.
  edge:
    description: full keeps the voice's swearing and dark humour where it has them; clean takes them out.
    default: full

outputs:
  text:
    description: The text in the voice.

runs:
  using: node24
  main: main.ts
